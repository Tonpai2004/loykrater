<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="45%" stop-color="#FFF275" stop-opacity="0.55" />
      <stop offset="75%" stop-color="#F4D06F" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F4D06F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FFFDE8" />
      <stop offset="45%" stop-color="#FFF275" />
      <stop offset="100%" stop-color="#F4C542" />
    </radialGradient>
  </defs>
  <!-- Soft full-moon glow -->
  <circle cx="32" cy="32" r="32" fill="url(#halo)" />
  <!-- Full moon with a thin gold rim so it still reads on light browser tabs -->
  <circle cx="32" cy="32" r="21" fill="url(#moon)" stroke="#D4A62A" stroke-width="1.5" />
  <!-- Gentle flat-color maria -->
  <circle cx="25" cy="27" r="4.2" fill="#F4D06F" opacity="0.55" />
  <circle cx="37.5" cy="37" r="5.2" fill="#F4D06F" opacity="0.45" />
  <circle cx="36" cy="24" r="2.4" fill="#F4D06F" opacity="0.5" />
</svg>
